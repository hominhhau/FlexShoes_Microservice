apiVersion: v1
kind: ServiceAccount
metadata:
  name: jenkins
  namespace: flexshoes
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: flexshoes
  name: jenkins-role
rules:
  - apiGroups: ["", "apps", "networking.k8s.io", "batch"]
    resources: ["pods", "deployments", "services", "ingresses", "configmaps", "secrets", "persistentvolumeclaims", "jobs"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: jenkins-rolebinding
  namespace: flexshoes
subjects:
  - kind: ServiceAccount
    name: jenkins
    namespace: flexshoes
roleRef:
  kind: Role
  name: jenkins-role
  apiGroup: rbac.authorization.k8s.io