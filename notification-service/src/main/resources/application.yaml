server:
  port: 8082
  servlet:
    context-path: /notification

# Eureka client
eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/

# Spring Cloud Config
management:
  trace:
    sampling:
      probability: 1.0

spring:
  application:
    name: notification-service
  config:
    import: "optional:configserver:http://localhost:8088"
  data:
    mongodb:
      uri: mongodb://root:root@localhost:27017/notification-service?authSource=admin

# Config server spring.config.import=optional:configserver:http://localhost:8088


