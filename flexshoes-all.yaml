apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: flexshoes
  labels:
    app: user-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
    spec:
      containers:
        - name: user-service
          image: ctmyname/user-service:VERSION_PLACEHOLDER
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
              value: "http://eureka-server:8761/eureka/"
            - name: SPRING_CONFIG_IMPORT
              value: "optional:configserver:http://config-server:8088"
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:mariadb://mariadb:3306/spring_security_jwt?createDatabaseIfNotExist=true"
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: mariadb-secrets
                  key: MYSQL_ROOT_USERNAME
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mariadb-secrets
                  key: MYSQL_ROOT_PASSWORD
            - name: URL_NOTIFICATION_SERVICE
              value: "http://notification-service:8082/notification"
            - name: URL_USER_SERVICE
              value: "http://profile-service:8081/profile"
          volumeMounts:
            - name: user-service-data
              mountPath: /path/to/data
#          livenessProbe:
#            httpGet:
#              path: /actuator/health
#              port: 8080
#            initialDelaySeconds: 120
#            periodSeconds: 30
#            failureThreshold: 3
#          readinessProbe:
#            httpGet:
#              path: /actuator/health
#              port: 8080
#            initialDelaySeconds: 120
#            periodSeconds: 10
#            failureThreshold: 3
          resources:
            requests:
              cpu: "100m"           # Tăng từ 50m → 200m
              memory: "512Mi"       # Tăng từ 256Mi → 512Mi
            limits:
              cpu: "500m"           # Tăng từ 100m → 500m
              memory: "1Gi"         # Tăng từ 512Mi → 1Gi
      volumes:
        - name: user-service-data
          persistentVolumeClaim:
            claimName: user-service-pvc
