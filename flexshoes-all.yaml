---
apiVersion: v1
kind: Namespace
metadata:
  name: flexshoes
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: eureka-server
  namespace: flexshoes
  labels:
    app: eureka-server
spec:
  replicas: 2
  selector:
    matchLabels:
      app: eureka-server
  template:
    metadata:
      labels:
        app: eureka-server
    spec:
      containers:
        - name: eureka-server
          image: ctmyname/eureka-server:VERSION_PLACEHOLDER
          imagePullPolicy: Always
          ports:
            - containerPort: 8761
          env:
            - name: SPRING_APPLICATION_NAME
              value: "eureka-server"
            - name: EUREKA_INSTANCE_HOSTNAME
              value: "eureka-server"
            - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
              value: "http://eureka-server:8761/eureka/"
          livenessProbe:
            httpGet:
              path: /
              port: 8761
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 8761
            initialDelaySeconds: 60
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: "200m"           # Tăng từ 50m → 200m
              memory: "512Mi"       # Tăng từ 256Mi → 512Mi
            limits:
              cpu: "500m"           # Tăng từ 100m → 500m
              memory: "1Gi"         # Tăng từ 512Mi → 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: eureka-server
  namespace: flexshoes
spec:
  selector:
    app: eureka-server
  ports:
    - protocol: TCP
      port: 8761
      targetPort: 8761
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: config-server
  namespace: flexshoes
  labels:
    app: config-server
spec:
  replicas: 2
  selector:
    matchLabels:
      app: config-server
  template:
    metadata:
      labels:
        app: config-server
    spec:
      initContainers:
        - name: wait-for-eureka
          image: busybox:1.36
          command: [ "sh", "-c", "until wget --spider http://eureka-server:8761/actuator/health; do echo waiting for eureka-server; sleep 5; done;" ]
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"
      containers:
        - name: config-server
          image: ctmyname/config-server:VERSION_PLACEHOLDER
          imagePullPolicy: Always
          ports:
            - containerPort: 8088
          env:
            - name: SPRING_APPLICATION_NAME
              value: "config-server"
            - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
              value: "http://eureka-server:8761/eureka/"
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8088
            initialDelaySeconds: 90
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8088
            initialDelaySeconds: 90
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: "200m"           # Tăng từ 50m → 200m
              memory: "512Mi"       # Tăng từ 256Mi → 512Mi
            limits:
              cpu: "500m"           # Tăng từ 100m → 500m
              memory: "1Gi"         # Tăng từ 512Mi → 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: config-server
  namespace: flexshoes
spec:
  selector:
    app: config-server
  ports:
    - protocol: TCP
      port: 8088
      targetPort: 8088
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongodb
  namespace: flexshoes
  labels:
    app: mongodb
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongodb
  template:
    metadata:
      labels:
        app: mongodb
    spec:
      containers:
        - name: mongodb
          image: mongo:6.0
          ports:
            - containerPort: 27017
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: mongodb-secrets
                  key: MONGO_INITDB_ROOT_USERNAME
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mongodb-secrets
                  key: MONGO_INITDB_ROOT_PASSWORD
            - name: MONGO_INITDB_DATABASE
              value: "notification-service"
          volumeMounts:
            - name: mongodb-data
              mountPath: /data/db
          livenessProbe:
            exec:
              command: ["mongosh", "--eval", "db.adminCommand('ping')"]
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: "200m"           # Tăng từ 50m → 200m
              memory: "512Mi"       # Tăng từ 256Mi → 512Mi
            limits:
              cpu: "500m"           # Tăng từ 100m → 500m
              memory: "1Gi"         # Tăng từ 512Mi → 1Gi
      volumes:
        - name: mongodb-data
          persistentVolumeClaim:
            claimName: mongodb-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: mongodb
  namespace: flexshoes
spec:
  selector:
    app: mongodb
  ports:
    - protocol: TCP
      port: 27017
      targetPort: 27017
  type: ClusterIP
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mongodb-pvc
  namespace: flexshoes
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgresdb
  namespace: flexshoes
  labels:
    app: postgresdb
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgresdb
  template:
    metadata:
      labels:
        app: postgresdb
    spec:
      containers:
        - name: postgresdb
          image: postgres:15
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgresdb-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgresdb-secrets
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              value: "ChatDB"
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: "200m"           # Tăng từ 50m → 200m
              memory: "512Mi"       # Tăng từ 256Mi → 512Mi
            limits:
              cpu: "500m"           # Tăng từ 100m → 500m
              memory: "1Gi"         # Tăng từ 512Mi → 1Gi
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: postgres-pvc
---
