          imagePullPolicy: Always
          ports:
            - containerPort: 8888
          env:
            - name: KEY_BASEURL
              value: "http://user-service:8080"
            - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
              value: "http://eureka-server:8761/eureka/"
