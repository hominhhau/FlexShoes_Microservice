  namespace: flexshoes
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: batch/v1
kind: Job
metadata:
  name: create-order-db
  namespace: flexshoes
spec:
  template:
    spec:
      containers:
        - name: create-db
          image: mcr.microsoft.com/mssql-tools:latest
          command:
            - /bin/bash
            - -c
            - |
              sleep 30 && \
              /opt/mssql-tools/bin/sqlcmd -S mssql -U sa -P "$MSSQL_SA_PASSWORD" -Q "CREATE DATABASE OrderService;"
          env:
            - name: MSSQL_SA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mssql-secrets
                  key: MSSQL_SA_PASSWORD
      restartPolicy: Never

