            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8888
            initialDelaySeconds: 60
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: "200m"           # Tăng từ 50m → 200m
              memory: "512Mi"       # Tăng từ 256Mi → 512Mi
            limits:
              cpu: "500m"           # Tăng từ 100m → 500m
              memory: "1Gi"         # Tăng từ 512Mi → 1Gi
---
