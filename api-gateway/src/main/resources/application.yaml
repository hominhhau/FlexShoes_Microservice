server:
    port: 8888

app:
    api-prefix: /api/v1

# Eureka client
eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/

# Spring Cloud Config
management:
  trace:
    sampling:
      probability: 1.0

spring:
  application:
    name: api-gateway
  config:
    import: "optional:configserver:http://localhost:8088"
  cloud:
    gateway:
      routes:
        - id: notification_service
          uri: http://localhost:8082
          predicates:
          - Path=${app.api-prefix}/notification/**
          filters:
          - StripPrefix=2
        - id: payment_service
          uri: http://localhost:8084
          predicates:
            - Path=${app.api-prefix}/payment/**
          filters:
            - StripPrefix=2
        - id: profile_service
          uri: http://localhost:8081
          predicates:
            - Path=${app.api-prefix}/profile/**
          filters:
            - StripPrefix=2
        - id: inventory_service
          uri: http://localhost:8085
          predicates:
            - Path=${app.api-prefix}/inventory/**
          filters:
            - StripPrefix=2
        - id: order_service
          uri: http://localhost:8083
          predicates:
            - Path=${app.api-prefix}/invoices/**
          filters:
            - StripPrefix=2
        - id: user_service
          uri: http://localhost:8080
          predicates:
            - Path=${app.api-prefix}/**
          filters:
            - StripPrefix=2

logging:
  level:
    org.springframework.cloud.gateway: DEBUG

