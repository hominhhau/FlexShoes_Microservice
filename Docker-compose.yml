  order-service:
    restart: always
    build:
      context: ./order-service
      dockerfile: Dockerfile
    container_name: order-service
    depends_on:
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
      create-db:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:sqlserver://mssql:1433;databaseName=OrderService;encrypt=false;trustServerCertificate=true
      SPRING_DATASOURCE_USERNAME: "sa"
      SPRING_DATASOURCE_PASSWORD: "Sa@123456"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8088
    ports:
      - "8083:8083"
    networks:
      - my-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  inventory-service:
    build:
      context: ./inventory-service  # Chỉ định thư mục chứa Dockerfile
      dockerfile: Dockerfile
    ports:
      - "8085:8085"
    depends_on:
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    environment:
      - SPRING_APPLICATION_NAME=inventory-service
      - EUREKA_INSTANCE_HOSTNAME=eureka-server
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - PORT=8085
      - MONGO_URI=mongodb+srv://FlexShoes:PasswordFlexShoes@cluster0.jxtoglw.mongodb.net/inventoryDB?retryWrites=true&w=majority
    env_file:
      - ./inventory-service/.env
    volumes:
      - ./inventory-service:/app
      - /app/node_modules
    restart: always
    networks:
      - my-network

  notification-service:
    image: notification-service
    container_name: notification-service
    build:
      context: ./notification-service  # Chỉ định thư mục chứa Dockerfile
      dockerfile: Dockerfile
    ports:
      - "8082:8082"
    env_file:
      - .env
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config-server:8088
      - SPRING_DATA_MONGODB_URI=mongodb://root:root@mongodb:27017/notification-service?authSource=admin
    depends_on:
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    networks:
      - my-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8082/notification/actuator/health" ]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: always

  api-gateway:
    image: api-gateway
    container_name: api-gateway
    build:
      context: ./api-gateway  # Chỉ định thư mục chứa Dockerfile
      dockerfile: Dockerfile
    ports:
      - "8888:8888"
    environment:
      - KEY_BASEURL=http://user-service:8080
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config-server:8088
    depends_on:
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
      notification-service:
        condition: service_started
      user-service:
        condition: service_started
      profile-service:
        condition: service_started
    networks:
      - my-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8888/actuator/health" ]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: always

  user-service:
    build:
      context: ./user-service  # Chỉ định thư mục chứa Dockerfile
      dockerfile: Dockerfile
    container_name: user-service
    depends_on:
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
      mariadb:
        condition: service_healthy
      notification-service:
        condition: service_started
      profile-service:
        condition: service_started
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config-server:8088
      - SPRING_DATASOURCE_URL=jdbc:mariadb://mariadb:3306/spring_security_jwt?createDatabaseIfNotExist=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root
      - URL_NOTIFICATION_SERVICE=http://notification-service:8082/notification
      - URL_USER_SERVICE=http://profile-service:8081/profile
    ports:
      - "8080:8080"
    networks:
      - my-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    restart: always

  profile-service:
    build:
      context: ./profile-service  # Chỉ định thư mục chứa Dockerfile
      dockerfile: Dockerfile
    container_name: profile-service
    depends_on:
      mariadb:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
    environment:
      - SPRING_SLEUTH_SAMPLER_PROBABILITY=1.0
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config-server:8088
      - SPRING_DATASOURCE_URL=jdbc:mariadb://mariadb:3306/spring_security_jwt?createDatabaseIfNotExist=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root
    ports:
      - "8081:8081"
    networks:
      - my-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8081/actuator/health" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    restart: always


volumes:
  mongodb-data:
  mariadb-data:
  mssql-data:

networks:
  my-network:
    driver: bridge