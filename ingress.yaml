apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: flexshoes-ingress
  namespace: flexshoes
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod" # Bỏ comment để kích hoạt cert-manager
spec:
  rules:
    - host: flexshoes.io.vn
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
    - host: api.flexshoes.io.vn
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 8888
  tls:
    - hosts:
        - flexshoes.io.vn
        - api.flexshoes.io.vn
      secretName: flexshoes-tls