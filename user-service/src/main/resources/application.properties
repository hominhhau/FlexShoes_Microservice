spring.application.name=user-service
server.port=8080

# Setting database
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.datasource.url=jdbc:mariadb://localhost:3306/spring_security_jwt\
  ?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root

spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true

spring.main.allow-bean-definition-overriding=true
spring.main.allow-circular-references = true

rsa.rsa-private-key=classpath:certs/private.pem
rsa.rsa-public-key=classpath:certs/public.pem


# Setting variables for time of JWT token refresh and access (minutes)
ACCESS.DURATION=${ACCESS_DURATION:1000}
REFRESH.DURATION=${REFRESH_DURATION:60}

# Setting variables for url of OpenFeign
url.profileService=${URL_USER_SERVICE:http://localhost:8081/profile}

url.notificationService=${URL_NOTIFICATION_SERVICE:http://localhost:8082/notification}

# Config server
spring.config.import=optional:configserver:http://localhost:8088
